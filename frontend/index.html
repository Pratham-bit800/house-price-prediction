<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Predict house prices using machine learning. Enter property details and get instant AI-powered price estimates.">
    <title>HousePriceAI | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">🏠</span>
            <h1 class="sidebar-title">HousePrice<span class="accent">AI</span></h1>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" id="nav-dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Dashboard
            </a>
            <a href="#" class="nav-item" id="nav-predict">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                Predict
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="model-badge">
                <span class="badge-dot"></span>
                Model Active
            </div>
        </div>
    </aside>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <button class="menu-toggle" id="menu-toggle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="mobile-logo">
            <span>🏠</span> HousePrice<span class="accent">AI</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Top Bar -->
        <div class="topbar">
            <div>
                <h2 class="page-title">Price Prediction</h2>
                <p class="page-subtitle">Enter property details</p>
            </div>
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">

            <!-- LEFT COLUMN: Prediction Form -->
            <div class="form-column">
                <form id="prediction-form" novalidate>

                    <!-- Property Details -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">🏗️</span>
                            <h3>Property Details</h3>
                        </div>
                        <div class="card-grid">
                            <div class="field">
                                <label for="bedrooms">Bedrooms</label>
                                <input type="number" id="bedrooms" name="bedrooms" value="3" min="0" max="33">
                            </div>
                            <div class="field">
                                <label for="bathrooms">Bathrooms</label>
                                <input type="number" id="bathrooms" name="bathrooms" value="2" min="0" max="8" step="0.25">
                            </div>
                            <div class="field">
                                <label for="sqft_living">Living Area (sqft)</label>
                                <input type="number" id="sqft_living" name="sqft_living" value="2000" min="200" max="14000">
                            </div>
                            <div class="field">
                                <label for="sqft_lot">Lot Size (sqft)</label>
                                <input type="number" id="sqft_lot" name="sqft_lot" value="5000" min="500" max="1700000">
                            </div>
                            <div class="field">
                                <label for="floors">Floors</label>
                                <input type="number" id="floors" name="floors" value="1" min="1" max="3.5" step="0.5">
                            </div>
                            <div class="field">
                                <label for="sqft_above">Above Ground (sqft)</label>
                                <input type="number" id="sqft_above" name="sqft_above" value="1500" min="200" max="10000">
                            </div>
                            <div class="field">
                                <label for="sqft_basement">Basement (sqft)</label>
                                <input type="number" id="sqft_basement" name="sqft_basement" value="0" min="0" max="5000">
                            </div>
                        </div>
                    </div>

                    <!-- Quality & Condition -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">⭐</span>
                            <h3>Quality & Condition</h3>
                        </div>
                        <div class="card-grid">
                            <div class="field">
                                <label for="condition">Condition <span class="hint">(1-5)</span></label>
                                <input type="number" id="condition" name="condition" value="3" min="1" max="5">
                            </div>
                            <div class="field">
                                <label for="grade">Grade <span class="hint">(1-13)</span></label>
                                <input type="number" id="grade" name="grade" value="7" min="1" max="13">
                            </div>
                            <div class="field">
                                <label for="view">View Rating <span class="hint">(0-4)</span></label>
                                <input type="number" id="view" name="view" value="0" min="0" max="4">
                            </div>
                            <div class="field">
                                <label for="waterfront">Waterfront</label>
                                <select id="waterfront" name="waterfront">
                                    <option value="0" selected>No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Neighborhood & Timeline -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">📍</span>
                            <h3>Neighborhood & Timeline</h3>
                        </div>
                        <div class="card-grid">
                            <div class="field">
                                <label for="sqft_living15">Neighbor Living (sqft)</label>
                                <input type="number" id="sqft_living15" name="sqft_living15" value="1800" min="300" max="7000">
                            </div>
                            <div class="field">
                                <label for="sqft_lot15">Neighbor Lot (sqft)</label>
                                <input type="number" id="sqft_lot15" name="sqft_lot15" value="5000" min="600" max="900000">
                            </div>
                            <div class="field">
                                <label for="yr_built">Year Built</label>
                                <input type="number" id="yr_built" name="yr_built" value="2000" min="1900" max="2015">
                            </div>
                            <div class="field">
                                <label for="yr_renovated">Renovated <span class="hint">(0=never)</span></label>
                                <input type="number" id="yr_renovated" name="yr_renovated" value="0" min="0" max="2015">
                            </div>
                            <div class="field">
                                <label for="sale_year">Sale Year</label>
                                <input type="number" id="sale_year" name="sale_year" value="2015" min="2014" max="2026">
                            </div>
                            <div class="field">
                                <label for="sale_month">Sale Month <span class="hint">(1-12)</span></label>
                                <input type="number" id="sale_month" name="sale_month" value="6" min="1" max="12">
                            </div>
                        </div>
                    </div>

                    <!-- Predict Button -->
                    <button type="submit" id="predict-btn" class="predict-btn">
                        <span class="btn-text">⚡ Predict Price</span>
                        <span class="btn-loader" id="btn-loader"></span>
                    </button>
                </form>
            </div>

            <!-- RIGHT COLUMN: Results Panel -->
            <div class="results-column">

                <!-- Prediction Result Card -->
                <div class="card result-card" id="result-card">
                    <div class="card-header">
                        <span class="card-icon">💰</span>
                        <h3>Predicted Market Value</h3>
                    </div>
                    <div class="price-display" id="price-display">
                        <div class="price-amount" id="price-amount">--.--</div>
                    </div>
                </div>



                <!-- Error Display -->
                <div class="card error-card hidden" id="error-card">
                    <div class="error-content">
                        <span class="error-icon">⚠️</span>
                        <p id="error-message">Something went wrong.</p>
                    </div>
                </div>

            </div>
        </div>


    </main>

    <script src="script.js"></script>
</body>
</html>
